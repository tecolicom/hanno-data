# 都市 (この data repo) 固有の設定。クローラのコード (calendar/bin/) は都市非依存に
# 保ち、起動時にここを読む。source ごとの設定は sources.yaml。
#
# 多都市展開時は、各 data repo がこのファイルを自分の値で持つ。

# ⚠️ uid_namespace は iCalUID の `@` 以降にそのまま入る。
#    変えると全イベントの UID が変わり、カレンダーが総入れ替えになる (旧 UID の
#    イベントが残り、新 UID で全件が再作成される)。触らないこと。
uid_namespace: hanno.city.tecoli.com

# 全 crawler 共通の User-Agent (取得先サーバ側で連絡先が辿れる identifier)
user_agent: "myhanno-calendar-fetcher/0.1 (+https://city.tecoli.com)"

# 管理対象 Google Calendar (logical name → Calendar ID)
# 命名規則: 言語以外の base key と、言語別 `<base>.<lang>` の組合せ。
# `default` は必須 (source.type が未登録のときの行き先)。
calendars:
  # 日本語 (lang=default)
  default: "205403c971dc5ef21efd81c1d53849cadfd901b75c77d88955d9600f45f2a013@group.calendar.google.com"      # Myはんのう (公開イベント・ツーリズム・市民会館 等)
  gikai: "6745914b24323112a15f43dc20b3a0f4a4817afd800c8d1687d0bf0b7f890c61@group.calendar.google.com"        # 飯能市役所
  # 英語 (lang=en) — JP と対称構成
  default.en: "d9193cf5f644ab41a28e2268a98abc5aa426bd2d577152834244ad69a31f5a68@group.calendar.google.com"   # Myはんのう（EN）
  gikai.en: "b6f36e19751c05cce99fa00828e429f40f6db100e2dbe442bc2622a25da97316@group.calendar.google.com"     # 飯能市役所（EN）
  # 飯能商工会議所「日替わりシェフレストラン」当番表 (集合同期型)。
  # tecolicom@gmail.com 所有、city-tecoli のアプリが商工会議所の店舗ページ
  # (place_id: ChIJ_aM0DDcmGWAR3KV7H6eOrIs) から作成したもの。
  # EN 版は作らない: 店舗ページに i18n が無く、読む場所が存在しないため
  # (cal-translate-en の NO_TRANSLATION_SOURCE_TYPES で除外している)。
  chef: "ae1577f36d2b51db208baec59cc84e90ceab25d41bad166b42c37fb7063f4a46@group.calendar.google.com"         # 日替わりシェフレストラン
  # 飯能商工会議所の告知 (お知らせ・セミナー・経営支援・地域振興)。
  # tecolicom@gmail.com 所有、一般公開、SA に writer を委託。gws CLI で作成。
  # chef と違い **英訳する** — 告知は説明文なので訳す価値がある
  # (chef を訳さないのは店名が固有名詞で情報が増えないため)。
  cci: "b0a56c8e1f5246cda41e2fdb3c449b20c50bb365aac92333a4a9290a21e7edcf@group.calendar.google.com"          # 商工会議所からのお知らせ
  cci.en: "b932613ee11b3b16657b986a7ec1bd82ad7c385c30de75a2db5834ba1a297e32@group.calendar.google.com"       # 商工会議所からのお知らせ（EN）

# source.type → calendar (logical name) ルーティング。
# 未登録の source.type は `default` に行く。
# logical name "gikai" は内部呼称、display は「飯能市役所」(議会以外の市政情報も含む)。
source_type_to_calendar:
  city-hanno-gikai: gikai
  city-hanno-shicho-blog: gikai
  city-hanno-oshirase: gikai
  hanno-cci-chef: chef
  hanno-cci-event: cci
