description: |-
  飯能エコツーリズム協会: https://hanno-tourism.jp/hanno-eco/tour/ec-tairakuri-konnyaku-2/
  
  吾野地域の里山の季節を見て、聞いて、味わうツアーです。こんにゃく芋は成長するまでに約3年かかります。昔ながらの調理法でこんにゃくを作ってみましょう。自分で作ったこんにゃくはお持ち帰りいただけます。
  
  【利用料金】大人4,000円、小学生3,000円、未就学児1,500円 （ガイド、保険、昼食など）
  
  【定員】3組（1組4名まで）
  
  【ガイド】たいら栗園スタッフ
  
  【持ち物】飲み物、エプロン、三角巾、タオル、マスク
  
  【備考】たいら栗園 HP https://tairakurien.com/

