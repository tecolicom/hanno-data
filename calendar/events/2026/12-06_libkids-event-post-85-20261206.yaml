      The Children's Library will close temporarily for facility repairs during the period below.
      
      We apologize for any inconvenience and appreciate your understanding and cooperation.
      
      【Closure Period (all day)】
      
      December 4, 2026 (Reiwa 8) through January 15, 2027 (Reiwa 9)
      
      【Changes during the closure】
      
      • The Children's Library will not offer in-library reading, book lending, or returns.
      
      • If you have reserved materials for pickup at the Children's Library, please pick them up at the main Hanno Library instead.
      
      • The book drop box will remain available during the closure period.
      
