description: |-
  🆕 新着掲載 (公開日: 2026-09-18)
  
  ## 台風25号について
  
  台風25号の影響により、週末からの連休期間において、大雨・強風となる可能性があります。低い土地の浸水や河川の増水、土砂災害等にご注意ください。
  
  事前の備えをお願いします
  
  ・懐中電灯、電池、携帯ラジオの準備
  
  ・携帯電話の充電
  
  ・飲料水等の確保
  
  ・家の周りの点検
  
  ・飛ばされやすいものを室内へ など
  
  土のうの配布
  
  台風の進路や強さは変化する可能性があります
  
  最新の気象状況を継続的に確認してください。
  
  「気象庁ホームページ」のキキクルや時系列情報をご確認いただくとともに、最新の防災気象情報に留意してください。
  
  気象庁：飯能市の防災情報（外部サイト）
  
  飯能市土砂災害ハザードマップ
  
  時系列情報
  
  気象防災情報・気象解説情報等
  
  警報・注意報、早期注意情報
  
  キキクル
  
  気象庁ホームページ
  
  飯能市公式サイト 新着情報: https://www.city.hanno.lg.jp/emergency/14415.html

