  ## 歯みがきのこと、おやつのこと、一緒に学びませんか？
  
  1・2歳頃は、食習慣や歯みがき習慣が身につく大切な時期です。
  
  「どんなおやつを選べばいい？」「歯みがきを嫌がる…」「歯医者さんにはいつ行けばいいの？」
  
  そんな疑問に保健師と栄養士がお答えします！
  
  内容
  
  ・むし歯を予防するポイント
  
  ・おやつの選び方・食べ方
  
  ・歯みがきのやり方
  
  ・歯科医院受診のタイミング
  
  希望者は個別相談も可能です！
  
  対象
  
  市内在住の1・2歳児と保護者
  
  日時
  
  令和8年9月17日 10時から
  
  会場
  
  保健センター
  
  持ち物
  
  母子健康手帳
  
  予約
  
  定員10組、予約制
  
