description: |-
  🆕 新着掲載 (公開日: 2026-07-29)
  
  ## 原市場福祉センターの空調設備が不調のため臨時休館いたします。
  
  令和8年7月29日（水曜日）現在、飯能市原市場福祉センターの空調設備が不調のため稼働しない状況となっております。気温の高い日が続いていることもあり、空調設備が正常に稼働しない状況では安全に原市場福祉センターをご利用していただくことができないと判断し、空調設備のメンテナンス等を行う間、臨時休館とさせていただきます。
  
  原市場福祉センターをご利用いただいている市民、団体の皆様には大変ご迷惑をお掛けいたしますが、ご理解とご協力をお願いいたします。
  
  飯能市公式サイト 新着情報: https://www.city.hanno.lg.jp/soshikikarasagasu/kenkohukusibu/chiikifukushika/14108.html

