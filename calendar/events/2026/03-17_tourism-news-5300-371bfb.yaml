  宮沢湖遊歩道の一部通行止めが解除されました。令和7年11月25日から倒木の危険により通行止めとしていた宮沢ため池湖畔の遊歩道(大字宮沢地内)について、伐採作業を実施し安全が確認されたため、通行止めを解除しました。通行止め解除区間の詳細は飯能市役所HPの案内図をご確認ください。

