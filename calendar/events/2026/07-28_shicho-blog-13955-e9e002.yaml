description: |-
  📝 市長ブログ更新 (公開日: 2026-07-19)
  
  7月18日（土曜日）・19日（日曜日）の2日間、飯能の夏の風物詩「飯能夏祭り」が盛大に開催され、多くの人出で賑わいました。
  
  19日（日曜日）本祭り当日は、飯能ケーブルテレビ様の「飯能夏祭り2026」に出演させていただきました。
  
  市内10か町の底抜け屋台の華やかな囃子の音色や市街地各所で行われた引き合わせでの迫力ある掛け合いに多くの方が魅了されておりました。
  
  市長ブログ「市政一直線」: https://www.city.hanno.lg.jp/shiseijoho/shichoshitsu/shichoblog/shisei2026/shisei202607/13955.html

