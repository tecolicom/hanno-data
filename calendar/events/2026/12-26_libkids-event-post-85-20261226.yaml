      The Hanno Children's Library will close temporarily for facility repairs during the following dates.
      
      We apologize for the inconvenience. Thank you for your understanding and cooperation.
      
      【Closure Period (all day)】
      
      December 4, 2026 (Friday) through January 15, 2027 (Friday)
      
      【Changes during the closure】
      
      • Library reading, book checkout, and returns at the Children's Library will not be available.
      
      • If you have a reserved item normally picked up at the Children's Library, please pick it up at Hanno Central Library instead.
      
      • The book drop box will remain available throughout the closure period.
      
