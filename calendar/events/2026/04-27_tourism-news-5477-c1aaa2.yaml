  奥むさし飯能観光協会（飯能商工会議所内）は4月29日(水・祝)～5月5日(火・祝)営業いたします。5月3日(日・祝)も営業するため、振替休日として5月6日(水)を休業いたします。この期間、マンホールカードの配布やイーグルバス定期券の購入等の対応ができかねます。飯能駅観光案内所「ぷらっと飯能」（TEL 042-978-9111）は通常通り9:00-17:00で営業しています。

