  令和8年飯能まつり（11月7日(土)・8日(日)開催）で出店する場合の申請書類提出について案内。物販・飲食・火気器具使用・道路や駐車場・民有地使用・普段と異なる形態での出店には、出店申請書兼誓約書の提出が必須。さらに出店内容に応じて、道路使用許可申請書（申請費用2,500円）、露店等の開設届出書、臨時出店の概要、土地使用承諾書などの提出が必要。駅前通り（飯能駅北口～東町交差点手前）は山車運行のため歩道への出店不可。提出先は(一社)奥むさし飯能観光協会（飯能まつり協賛会事務局）で、営業時間9:00～17:00（日曜定休）。提出期限は10月2日(金)厳守。

