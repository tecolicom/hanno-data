  台風接近に伴い、飯能河原の営業について以下の通りお知らせします。6月27日(土)は営業中止。6月28日(日)は川の増水状況により判断します。営業情報は公式X「飯能河原。いい塩梅。」にて更新予定。現地での河原増水確認は危険のため控えてください。

