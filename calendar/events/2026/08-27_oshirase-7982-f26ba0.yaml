  9月21日は世界アルツハイマーデーです。飯能市では毎年9月にアルツハイマー月間として、認知症に関連した様々な取り組みを実施しています。令和8年度は、アルツハイマー講演会を開催するほか、図書館において「認知症の人にやさしいまちへ」をテーマにした推薦図書の特別展示を行います。誰もがあんしんできるまちづくりを目指し、認知症について共に考える機会にご参加ください。
  
