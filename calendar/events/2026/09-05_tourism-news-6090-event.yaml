  奥むし飯能観光協会は、飯能商工会議所の定期施設メンテナンスのため、令和8年9月5日(土)・9月6日(日)に臨時休業いたします。電話対応を含む案内業務がお休みとなります。対象日はイーグルバス定期券ご購入、マンホールカードの配布がご利用いただけません。なお、ぷらっと飯能（飯能駅観光案内所 TEL 042-978-9111 9時～17時）は通常通り営業しております。

