description: |-
  飯能エコツーリズム協会: https://hanno-tourism.jp/hanno-eco/tour/osampo-aki/
  
  山間の集落である、黒指・細田地区。家の軒先に並べられた季節の農作物や手作り品。山道を散歩しながら、買い物や住民とのふれあいを楽しみませんか？ 点在する家々の軒先を覗きながら、住民と触れ合うことで、心の洗濯が出来ると思います。地域全体でおもてなしを致しますので、ぜひ秋の里山を訪れてみてください。
  
  【利用料金】大人400円、小学生以下100円
  
  【定員】なし（当日受付）
  
  【持ち物】飲み物・軽食
  
  【備考】主催者：お散歩マーケット実行委員会 HP https://kamibun.x0.to/

