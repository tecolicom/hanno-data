description: |-
  飯能エコツーリズム協会: https://hanno-tourism.jp/hanno-eco/tour/ec-canoe-sup/
  
  名栗湖でのSUP体験は、四季折々の自然と湖の静けさを全身で感じながら楽しめる、心と体にやさしいエコツアーです。
  
  【利用料金】一人4,000円 （ガイド、保険、SUPボードレンタル代など）
  
  【定員】5名
  
  【ガイド】認定NPO法人名栗カヌー工房スタッフ
  
  【持ち物】タオル、着替え、必要ならばウォーターシューズ（裸足でも可）
  
  【備考】認定NPO法人名栗カヌー工房 HP https://naguri-canoe.co.jp/

