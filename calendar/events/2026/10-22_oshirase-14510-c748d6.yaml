description: |-
  🆕 新着掲載 (公開日: 2026-10-21)
  
  ## 乱開発抑止一斉パトロールとは
  
  埼玉県および埼玉県内25市町と連携し、圏央道インターチェンジ周辺などの乱開発抑止を目的とした一斉パトロールを実施します。
  
  乱開発の定義など、詳細は埼玉県ホームページをご覧ください。
  
  埼玉県ホームページ「産業基盤づくり周辺地域 乱開発抑止の取組」
  
  パトロール実施期間
  
  令和8年11月2日（月曜日）から令和8年11月30日（月曜日）
  
  乱開発抑止一斉パトロールに関する問い合わせ
  
  埼玉県産業基盤対策幹
  
  電話番号
  
  048-830-5545
  
  飯能市公式サイト 新着情報: https://www.city.hanno.lg.jp/soshikikarasagasu/kankyokeizaibu/nogyoshinkoka/keikaku/14510.html

