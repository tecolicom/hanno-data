summary: "ℹ️ 令和8年度文化財防火訓練を10月25日に実施します"
url: "https://www.city.hanno.lg.jp/soshikikarasagasu/kyoikubu/hakubutsukan/bunkazaitanto/bunkazai/14146.html"
