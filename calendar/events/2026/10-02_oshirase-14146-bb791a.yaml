description: |-
  🔄 内容更新 (公開日: 2026-10-01 / 前回掲載: 2026-10-01)
  
  市では、文化財の建造物等を火災等の災害から守るため、地域の皆さんのご協力のもと、文化財防火訓練を毎年実施しています。今年度は常楽院（高山不動）で実施します。
  
  ## 日時
  
  令和8年10月25日（日曜日） 14時から1時間程度
  
  ## 場所
  
  常楽院（高山346）
  
  ## その他
  
  訓練当日は13時50分から訓練終了まで周辺道路が一時通行止めとなります。恐れ入りますがご理解ご協力をいただきますようお願い申し上げます。
  
  飯能市公式サイト 新着情報: https://www.city.hanno.lg.jp/soshikikarasagasu/kyoikubu/hakubutsukan/bunkazaitanto/bunkazai/14146.html

