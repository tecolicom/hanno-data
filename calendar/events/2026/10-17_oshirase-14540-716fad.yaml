  飯能市防災行政無線音声応答サービス運営事業者がシステム連携していた株式会社アルカディアで不正アクセスが発生し、個人情報漏洩の可能性をお知らせしておりましたが、同社システムに飯能市防災行政無線音声応答サービス利用者の個人情報の登録がないことを確認しました。利用者の皆さまに多大なご心配とご迷惑をおかけしたことをお詫びいたします。
  
  放送内容の配信については、飯能市が管理しているサイト・Facebook・防災X（旧Twitter）で通常通り配信しています。なお「Yahoo！防災速報アプリ」は市の管理外のため、再開の権限はありません。
  
  飯能市公式サイト 新着情報: https://www.city.hanno.lg.jp/emergency/14540.html

