  2027年3月末の手形・小切手交換廃止に向けた対応セミナーです。制度変更の背景、中小企業が今実施すべき電子決済手段「でんさい」への移行、社内整備と取引先交渉の進め方について、中小企業診断士の川居宗則講師が詳しく解説します。漠然とした不安を解消し、スムーズな準備を進めるための実務知識が得られます。講演時間は約36分。飯能商工会議所会員向けの特典です。ご視聴にはID/パスワードが必要です。ご希望の会員事業所様は担当者にお問い合わせください。
  
