  AI による要約 (正確な情報は元記事をご確認ください)
  
  令和8年12月5日(土)・12月6日(日)、飯能商工会議所の定期施設メンテナンスのため、奥むさし飯能観光協会は電話対応を含む案内業務を休業いたします。この期間はイーグルバス定期券のご購入、マンホールカードの配布はできかねます。なお、ぷらっと飯能（飯能駅観光案内所 TEL 042-978-9111 9時〜17時）は通常通り営業しております。

