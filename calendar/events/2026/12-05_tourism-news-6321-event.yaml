    summary: "ℹ️ Closure notice: December 5–6, 2026 (Reiwa 8)"
    description: |-
      Automated translation (refer to source for accuracy)
      
      Okumushi Hanno Tourism Association will close its guidance services, including phone support, on Saturday, December 5 and Sunday, December 6, 2026 (Reiwa 8) due to regular facility maintenance at Hanno Chamber of Commerce and Industry. During this period, purchases of Eagle Bus passes and distribution of manhole cards will not be available.
      
      Plat Hanno (Hanno Station Tourist Information Center, TEL 042-978-9111, 9:00–17:00) will remain open as usual.
