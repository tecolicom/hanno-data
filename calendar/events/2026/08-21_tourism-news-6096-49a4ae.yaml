  🆕 新着掲載 (公開日: 2026-08-21)
  
  AI による要約 (正確な情報は元記事をご確認ください)
  
  下名栗諏訪神社の獅子舞奉納が行われます。揃いは2026年8月22日(土)、例大祭は2026年8月23日(日)です。例大祭では8時30分から17時50分頃まで、御宮参り・御幣懸り、花懸り、三拍子、神事式(雅楽奉奏)、棹懸り、女獅子隠し、白刃などが行われます。また、約200年前に青梅市成木の高水山から譲り受けた下名栗の獅子舞に伝わる秘伝書が初公開されます。一般公開は下名栗諏訪神社で行われます。

