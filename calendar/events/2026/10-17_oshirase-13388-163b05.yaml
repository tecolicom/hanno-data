      The list of Hanno City press releases for fiscal year 2026 has been updated. Recent major announcements include:
      
      • Temporary closure of the Children's Library due to facility repairs (announced October 16)
      • Temporary suspension of Hanno City Disaster Prevention Radio voice response service (announced October 15)
      • Earlier start date for fiscal 2026 influenza vaccination program (announced September 17)
      • Washegaku Dream School 5th Anniversary Commemorative Ceremony – celebrating five years since reopening the former school (announced September 11)
      • Comprehensive partnership agreement between Hanno City and Puss in Boots Co., Ltd. (announced August 26)
      
      For earlier announcements, please see the original articles.
      
