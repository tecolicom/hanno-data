description: |-
  🆕 新着掲載 (公開日: 2026-08-12)
  
  本日、午後6時7分に「土砂災害危険警報」が発表されたことから、加治地区行政センター、加治東地区行政センター、吾野地区行政センター、原市場地区行政センター、名栗地区行政センターに自主避難所を開設しました。
  
  ※自主避難所では、食料品や日用品等の提供は原則として行いません。
  
  避難する場合は、あらかじめ各自で最低限の必需品を持参してください。
  
  飯能市公式サイト 新着情報: https://www.city.hanno.lg.jp/emergency/11997.html

