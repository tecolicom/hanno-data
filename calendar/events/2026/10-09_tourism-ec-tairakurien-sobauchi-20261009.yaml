  飯能エコツーリズム協会: https://hanno-tourism.jp/hanno-eco/tour/ec-tairakurien-sobauchi/
  
  そば打ちは、生地作りから捏ね、のばし、切りまでのほぼ全工程を体験し、地元野菜と山菜の天ぷらと一緒に自分で打った“二八そば”を昼食として食べていただきます。
  
