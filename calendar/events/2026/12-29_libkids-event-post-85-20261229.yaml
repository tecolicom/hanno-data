      The Children's Library will close temporarily for facility repairs during the following period.
      
      We apologize for any inconvenience and appreciate your understanding and cooperation.
      
      【Closure Period (All Day)】
      
      December 4, 2026 (Friday) through January 15, 2027 (Friday)
      
      【Changes During Closure】
      
      • You cannot browse materials, borrow books, or return books at the Children's Library during this period.
      
      • If you reserved materials for pickup at the Children's Library, please pick them up at Hanno City Library instead.
      
      • The book drop box will remain available throughout the closure.
      
