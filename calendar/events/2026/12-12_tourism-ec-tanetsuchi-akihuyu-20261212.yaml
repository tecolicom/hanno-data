description: |-
  飯能エコツーリズム協会: https://hanno-tourism.jp/hanno-eco/tour/ec-tanetsuchi-akihuyu/
  
  落ち葉や枝を活かした菌ちゃん畑（ウネ）づくりや、秋野菜の種まき・植え付け、畑のお手入れを体験するツアー。菌ちゃん農法アドバイザーが日々のお手入れのポイントを分かりやすくお伝えします。ランチは菌ちゃん野菜を使ったイタリアンをレストランで堪能します。
  
  【利用料金】大人8,800円、中学生以下2,200円 （ガイド料、昼食代、材料費、保険料）
  
  【定員】15名
  
  【ガイド】飯能たねとつち農園スタッフ
  
  【持ち物】飲み物、帽子、タオル、手袋など

