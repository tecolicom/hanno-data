  🆕 新着掲載 (公開日: 2026-03-16)
  
  AI による要約 (正確な情報は元記事をご確認ください)
  
  奥むさし飯能観光協会の案内業務が令和8年3月21日(土)に飯能商工会議所の定期施設メンテナンスのため休業します。電話対応を含む案内業務全般が対象です。イーグルバス定期券購入、マンホールカード配布、謎解きキャンペーンと黄色い週デジタルスタンプラリーの景品お渡しができません。ただし3月21日(土)のみ、ぷらっと飯能(飯能駅観光案内所)では対応します。前日3月20日(金・祝)と翌日3月22日(日)は営業。ぷらっと飯能と夢馬は通常通り営業。

