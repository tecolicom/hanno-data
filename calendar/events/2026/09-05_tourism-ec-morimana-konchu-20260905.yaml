description: |-
  飯能エコツーリズム協会: https://hanno-tourism.jp/hanno-eco/tour/ec-morimana-konchu/
  
  飯能市にある里山で、地元で食されてきた山菜を採集し、その材料を使ったピザと天ぷらを食すツアーです。
  
  【利用料金】大人：4,500円、学生：3,000円、小学生以下2,000円 （ガイド、保険、資料、食材費など）
  
  【定員】10名
  
  【ガイド】森のフィールド学舎スタッフ
  
  【持ち物】飲み物、軽食、着替え、帽子、汚れてもいい服、履き慣れた靴（長靴があると便利）
  
  【備考】森のフィールド学舎HP https://morinomanabiya168.wixsite.com/website

