description: |-
  飯能エコツーリズム協会: https://hanno-tourism.jp/hanno-eco/tour/ec-cyokotto-wakoucha/
  
  原市場地域の水辺で生きもの探しと、コラボ企画として飯能のお茶で手もみ和紅茶も作ります。
  
  【利用料金】1人2,500円、一家族5,000円 （ガイド料、講師代、保険代）
  
  【定員】12名
  
  【ガイド】児嶋翼（飯能市エコツーリズム市民ガイドの会 いきもの部）
  
  【持ち物】飲み物、タオル、手袋（軍手など）、虫除け対策グッズ、雨具、あれば子ども用ライフジャケット（貸し出し用もございます）、あれば水網やケースなど（貸し出し用もございます） 濡れてもよい服装（あまり肌を露出しないもの）、膝ぐらいまで水に入るため濡れてもよい滑りにくい靴（長靴、サンダル不可）、帽子

