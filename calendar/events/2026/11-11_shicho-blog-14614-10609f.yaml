description: |-
  📝 市長ブログ更新 (公開日: 2026-11-03)
  
  11月3日(火曜日・祝日)、飯能市市民会館で開催された少年の主張大会に出席しました。 本大会は、小学生、中学生の皆さんが自らの考えを言葉にして伝える、自身の成長にもつながる大切な機会です。大会を開催いただいた、主催者である青少年育成飯能市民会議の皆様、関係者の皆様に感謝いたします。
  
