  五十嵐酒造の恒例新酒祭りが開催されます。日時は2026年12月5日(土)10:00~15:00。会場は五十嵐酒造（埼玉県飯能市川寺667−1）。飯能駅南口からシャトルバスが随時運行されます。新酒祭り限定酒の販売、新酒無料試飲（お一人様1回限り）、甘酒無料、日本酒バー、飲食ブース多数出展があります。

