description: |-
  飯能エコツーリズム協会: https://hanno-tourism.jp/hanno-eco/tour/ec-kitagawa-kawanina/
  
  吾野源流ホタル再生プロジェクトの一環として、ゲンジボタルの餌となるカワニナの生息調査と環境整備を行うプログラムです。
  
  【利用料金】一人：1,500円、小学生以下1,000円 （講師料、保険料、利用料等）
  
  【定員】30名
  
  【ガイド】児嶋 翼（飯能市エコツーリズム市民ガイドの会 いきもの部）
  
  【持ち物】軍手、帽子、着替え、水筒、濡れても良い服装、マリンシューズ（サンダル、長靴は禁止） ※あれば箱めがね、水アミ、ケースなど
  
  【備考】喜多川キャンピングベースＨＰ http://www.kitagawa-cb.jp/

