  🆕 新着掲載 (公開日: 2026-08-26)
  
  8月17日(月曜日)から25日(火曜日)までを期間として職員2名の派遣について依頼があり、次のとおり職員を派遣しました。
  
  ## 職員派遣について
  
  (1) 派遣期間：令和8年8月17日(月曜日)から25日(火曜日)までの9日間
  
  (2) 派遣先：熊本県熊本市
  
  (3) 派遣職員：2名
  
  (4) 業務内容：避難所運営業務、被害家屋認定調査業務
  
