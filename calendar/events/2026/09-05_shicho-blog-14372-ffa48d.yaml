  📝 市長ブログ更新 (公開日: 2026-09-04)
  
  9月4日（金曜日）、令和8年第3回飯能市議会定例会が開会されました。
  
  会期は9月4日から9月29日までで、条例案、補正予算案、道路議案など計30件の議案・認定についてご審議いただく予定です。
  
