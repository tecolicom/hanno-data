  飯能春まつりから名称を変更した「飯能さくらウィーク」を中央公園で開催します。期間は令和8年3月28日（土）～4月5日（日）の9日間。期間中はキッチンカーなどが出店し飲食を提供します。今年はボンボリの点灯（ライトアップ）はありません。駐車場は台数に限りがあるため公共交通機関の利用をお勧めします。会場はゴミ箱を設置していないため各自持ち帰りをお願いします。会場は全面禁煙です。

