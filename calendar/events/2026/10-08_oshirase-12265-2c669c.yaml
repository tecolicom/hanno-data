description: |-
  🔄 内容更新 (公開日: 2026-10-05 / 前回掲載: 2026-09-11)
  主な変更: 令和8年熊本地震災害義援金の受付終了予定日が令和8年10月23日から令和9年3月22日に変更されました。令和8年台風第25号災害義援金（千葉県）が新たに追加されました。2026年ベネズエラ地震救援金の受付が終了しました。
  
  AI による要約 (正確な情報は元記事をご確認ください)
  
  日本赤十字社埼玉県支部飯能地区では、国内義援金・海外救援金を受け付けています。
  
  【国内義援金（受付中）】
  ・令和6年能登半島地震災害義援金（石川県・富山県・新潟県）受付終了予定日：令和9年3月22日
  ・令和6年9月能登半島大雨災害義援金（石川県）受付終了予定日：令和9年3月22日
  ・令和8年熊本地震災害義援金（熊本県）受付終了予定日：令和9年3月22日
  ・令和8年7月滋賀県甲賀市の土砂崩れ災害義援金（滋賀県）受付終了予定日：令和9年1月22日
  ・令和8年8月千葉豪雨災害義援金（千葉県）受付終了予定日：令和9年3月22日
  ・令和8年8月27日からの大雨災害義援金（富山県・石川県：令和9年1月22日、福井県：令和8年11月30日）
  ・令和8年台風第25号災害義援金（千葉県）受付終了予定日：令和9年3月22日
  
  【海外救援金（受付中）】
  ・中東人道危機救援金 受付終了予定日：令和9年3月23日
  ・バングラデシュ南部避難民救援金 受付終了予定日：令和9年3月23日
  ・ウクライナ人道危機救援金 受付終了予定日：令和9年3月23日
  ・2026年コロンビア地震救援金 受付終了予定日：令和8年11月24日
  ・2026年ネパール洪水救援金 受付終了予定日：令和8年11月24日
  ・無指定海外救援金 通年受付
  
  【受付場所】市役所本庁舎正面玄関総合案内（募金箱）または地域福祉課（1階11番窓口）
  
  【受付時間】平日9時00分～16時30分
  
  領収書を希望される方は地域福祉課（1階11番窓口）で受け付けます。
  
  飯能市公式サイト 新着情報: https://www.city.hanno.lg.jp/soshikikarasagasu/kenkohukusibu/chiikifukushika/fukushisoumu/12265.html

