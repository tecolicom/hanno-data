  飯能夏祭り開催に伴い、奥むさし飯能観光協会は令和8年7月18日(土)・19日(日)に電話対応を含む案内業務を休業いたします。対象日はイーグルバス定期券購入とマンホールカード配布の対応ができません。ぷらっと飯能（飯能駅観光案内所）は通常通り営業しております。

