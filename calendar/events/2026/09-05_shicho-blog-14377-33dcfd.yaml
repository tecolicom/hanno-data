description: |-
  📝 市長ブログ更新 (公開日: 2026-09-01)
  
  本日、9月1日は防災の日です。大正12年9月1日に関東大震災が発生し、多くの方々が犠牲となりました。
  
  地震が発生したときは、その場から移動せず、「姿勢を低くする」、「頭を守る」、「動かずにじっとする」ことが大事です。このシェイクアウト訓練を全庁で実施しました。
  
  まずは自分の身は自分で守ることが大切です。地震のときには実践いただきますようお願いします。
  
