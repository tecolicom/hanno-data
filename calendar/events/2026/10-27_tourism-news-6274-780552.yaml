  🆕 新着掲載 (公開日: 2026-10-27)
  
  AI による要約 (正確な情報は元記事をご確認ください)
  
  奥むさし飯能観光協会（飯能商工会議所内）は、飯能まつり開催に伴い令和8年11月7日(土)・8日(日)の2日間、観光案内業務および電話対応をお休みいたします。イーグルバス定期券購入等のご利用やマンホールカードの配布ができませんのでご了承ください。なお、ぷらっと飯能（飯能駅観光案内所）は飯能まつりの2日間、9:00～19:00まで営業時間を延長します。

