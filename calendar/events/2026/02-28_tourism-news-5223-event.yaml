  AI による要約 (正確な情報は元記事をご確認ください)
  
  飯能ひな飾り展の開催に合わせて、飯能小町公園でマルシェを開催します。キッチンカーが出店し、かき氷、クレープ、ケバブ、スペアリブなど様々な飲食物を販売予定。2月28日（土）、3月1日（日）、3月7日（土）、3月8日（日）に開催。駐車場はないため、近隣の有料駐車場・コインパーキングをご利用ください。天候等により出店内容が変更になることがあります。

