  はんのう満喫！ムーミンバレーパーク（デジタル）が好評発売中。西武鉄道全線（多摩川線を除く）の一日乗車券、飯能駅北口～メッツァ間のバス往復乗車券、ムーミンバレーパーク1デーパス、飯能市内取扱加盟店で使える1,000円相当のクーポン、ムーミンバレーパークオリジナルクリップがセットになっています。2026年12月31日（木）～2027年1月4日（月）の年末年始期間は、ムーミンバレーパークとメッツァビレッジがクーポン取扱加盟店およびクリップ引き換え場所として追加対応となります。その他の取扱加盟店は年末年始に休業している店舗もあるため、事前確認が必要です。

