description: |-
  🔄 内容更新 (公開日: 2026-10-28 / 前回掲載: 2026-10-29)
  
  令和8年10月17日～18日の深夜に正丸駅駐車場において、関東運輸局埼玉運輸支局、自動車技術総合機構関東検査部、軽自動車検査協会及び埼玉県警察が合同で、不正改造車排除の一環として特別街頭検査を実施しました。
  
  詳細は、下記の国土交通省関東運輸局のプレスリリースをご覧ください。
  
  関東運輸局プレスリリース 埼玉運輸支局が、正丸駅にて 特別街頭検査を実施（別ウインドウで開きます）
  
