description: |-
  🆕 新着掲載 (公開日: 2026-11-18)
  
  ## 基金ポートフォリオ基本方針を策定しました
  
  基金ポートフォリオ基本方針は、今後の基金管理において「基金全体で財政リスクに備える」という考え方を基本に各基金を最適化（統合、廃止等）するとともに、財政調整基金及び減債基金の標準財政規模に対する割合に応じた対応水準を予め設定することで、当該基金が現在どの水準に位置しているかを明確にし、必要なタイミングで必要な対応を実施するための基本的な考え方を定めたものです。
  
