description: |-
  飯能エコツーリズム協会: https://hanno-tourism.jp/hanno-eco/tour/ec-logcamp-gibier/
  
  飯能で捕獲した鹿の解体から、ジビエ料理を食べるまでの体験ツアーです。山間地域の課題である獣害対策の一環として、解体施設ムジカを見学し鳥獣被害対策の現状を学びます。そして山の恵みに感謝しつつ、ジビエ料理をレストラン“ログキャンプ”で味わいます。
  
  【利用料金】一人10,000円 （ガイド料、食事代、保険代）
  
  【定員】8名
  
  【ガイド】佐藤 好則（特定非営利活動法人 crew-L）
  
  【持ち物】電車代、軍手、汚れてもいい服、歩きやすい靴
  
  【備考】※11月の催行は定員に達しましたため、受付を終了いたしました。 12月催行でのご参加をお待ちしております。

