      An experiential tour from butchering deer caught in Hanno to enjoying game meat cuisine. As part of wildlife damage control—a challenge in mountainous regions—you'll tour the butchering facility Musica and learn about current wildlife management efforts. Then, with gratitude for the blessings of the mountains, you'll savor game meat dishes at the restaurant Log Camp.
      
