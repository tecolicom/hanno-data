description: |-
  飯能エコツーリズム協会: https://hanno-tourism.jp/hanno-eco/tour/morimana-christmas-craft/
  
  自然に囲まれた里山で、クリスマスをやお正月を彩るオリジナルのアイテムを一緒に作りましょう。モリマナが手掛ける「アオジシ谷」には、クラフトに必要な木の実や種子も揃っています。材料は自分で集め、作業の合間にフィールドワークで自然を満喫できるのも魅力です。
  
  【利用料金】大人：5,000円、学生：4,000円、未就学児：2,500円 （ガイド代、保険代、資料代等）
  
  【定員】20名
  
  【ガイド】森のフィールド学舎スタッフ
  
  【持ち物】飲み物、着替え、軍手などの手袋、昼食、タオル
  
  【備考】森のフィールド学舎HP https://morinomanabiya168.wixsite.com/website

