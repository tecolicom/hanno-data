description: |-
  🆕 新着掲載 (公開日: 2026-08-13)
  
  飯能市に、線状降水帯予測が発表されたことから、飯能市内全域に高齢者等避難を発令しました。
  
  これに伴い、全地区行政センターに避難所を開設しました。
  
  高齢者や障害がある方など避難に時間のかかる方は、速やかに避難してください。
  
  飯能市公式サイト 新着情報: https://www.city.hanno.lg.jp/emergency/14177.html

