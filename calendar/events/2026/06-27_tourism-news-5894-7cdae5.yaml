      Hanno Riverbed will be closed on Saturday, June 27 and Sunday, June 28, 2026 (Reiwa 8) due to swollen water from typhoon impacts. Both paid and free areas are affected. Depending on river conditions, closure may extend beyond June 29. For safety, please do not approach the riverbed.
      
