description: |-
  2026年11月13日（金）未明に発生した Microsoft365の通信障害により、当所職員への連絡がし難い状況が発生しています。
  
  お客様におかれましては、ご不便・ご迷惑をお掛けいたしますこと、お詫び申し上げます。
  
  職員全員ではなく、一部職員は通信が可能ですので、代表番号へお掛けいただきますよう、お願いいたします。
  
  当所向け電話がつながりにくい（一部）
  Outlookにおけるメール・予定が確認できない（全職員）
  Teamsがつながりにくい（一部）
  
  ＜参考＞
  
  マイクロソフト大規模障害 発生6時間超 世界で不具合続く 「限定的に復旧を確認」もメール・AIサービスなど利用できず（出典：MSN）
  
