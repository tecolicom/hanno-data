  🆕 新着掲載 (公開日: 2026-04-20)
  
  AI による要約 (正確な情報は元記事をご確認ください)
  
  令和8年4月25日(土)から飯能河原の営業が始まります。水遊びなどが楽しめる無料の親水エリアと、バーベキューができる有料の火気使用エリアがあります。飯能駅から徒歩約15分。河原ではバーベキュー用品のレンタルも可能です。令和8年6月末頃までステージ広場（ウッドデッキ）が改築工事中のため、近隣道路を大型車両が通ることがあります。スタッフが配置されている営業日はゴミの回収も行っています。

