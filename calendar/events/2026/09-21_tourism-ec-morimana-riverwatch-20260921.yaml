description: |-
  飯能エコツーリズム協会: https://hanno-tourism.jp/hanno-eco/tour/ec-morimana-riverwatch/
  
  まだ暑さの残る初秋の名栗川（入間川）にくらす生きものを観察しながら、魚釣りを楽しみ、水辺にすむ生きものたちの繋がりや、水質指標生物を観察します。
  
  【利用料金】大人5,000円、学生4,000円、未就学児2,500円 （ガイド料、保険、資料代等）
  
  【定員】各日15名
  
  【ガイド】森のフィールド学舎スタッフ
  
  【持ち物】飲み物、着替え、帽子、昼食
  
  【備考】森のフィールド学舎HP https://morinomanabiya168.wixsite.com/website

