  第33回吾野宿まつり。8月22日(土)午後4時～9時、吾野宿(飯能市坂石町分周辺)で開催。西武鉄道池袋線吾野駅より徒歩3分。午後8時半から打ち上げ花火あり。雨天決行、荒天の場合中止。臨時駐車場は飯能市立奥武蔵小学校。周辺の混雑が予想されるため公共交通機関の利用を推奨。

