description: |-
  🆕 新着掲載 (公開日: 2026-11-18)
  
  ## 飯能市立こども図書館の機能維持に向けたサウンディング型市場調査を実施します
  
  本市では、「個別施設のあり方に関する段階的検討の基本方針」に基づき、施設そのものではなく、施設が担う「機能」を起点として、個別施設のあり方を検討することとしています。
  
  飯能市立こども図書館については、現在の施設を引き続き活用することを基本として、こども図書館として必要な機能を、より効率的かつ持続可能な方法で維持、継続できる可能性を検討しています。
  
  サウンディング型市場調査の詳細については、飯能市立図書館のウェブサイトをご覧ください。
  
