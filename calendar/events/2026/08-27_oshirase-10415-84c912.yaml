  🆕 新着掲載 (公開日: 2026-08-26)
  
  AI による要約 (正確な情報は元記事をご確認ください)
  
  飯能市では、令和9年度内の施設等整備に向けて、地域密着型サービス事業者の公募を実施しています。飯能市介護保険事業計画第9期計画（令和6年度～令和8年度）に基づくもので、サービスの質の確保・向上及び公正な選考を行います。応募に当たっては、「飯能市地域密着型サービス事業者公募要領」を確認してください。公募要領、申請書類一覧表、申請書類（Excel）が提供されています。
  
  飯能市公式サイト 新着情報: https://www.city.hanno.lg.jp/soshikikarasagasu/kenkohukusibu/kaigofukushika/ninteikyufu/10415.html

