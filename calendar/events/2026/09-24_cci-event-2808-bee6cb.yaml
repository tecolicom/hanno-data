    summary: "ℹ️ Saitama Minimum Wage Change Notice"
    description: |-
      Automated translation (refer to source for accuracy)
      
      Starting October 1, 2026 (Reiwa 8), the Saitama Prefecture minimum wage will be 1,196 yen per hour (an increase of 55 yen). The minimum wage applies to all workers in Saitama Prefecture regardless of age or employment type, including part-time workers and student workers. Both workers and employers should check that hourly wages meet or exceed 1,196 yen.
      
      For details, contact the Saitama Labor Bureau, Labor Standards Department, Wages Division (TEL 048-600-6205) or your nearest labor standards inspection office.
      
      Related: Saitama Labor Bureau website – Wages and Domestic Work
      
      Source (Japanese): https://www.hanno-cci.or.jp/xo_event/xo_event-2808/
