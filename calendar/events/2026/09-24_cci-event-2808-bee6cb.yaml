description: |-
  令和8年10月1日から埼玉県最低賃金は時間額1,196円（引上げ額55円）となります。最低賃金は年齢や雇用形態に関係なく、パートや学生アルバイトも含め、埼玉県内の事業場で働くすべての労働者に適用されます。働く人も雇う人も賃金額が1時間当たり1,196円以上かどうか必ず確認しましょう。
  
  詳しくは、埼玉労働局労働基準部賃金室（TEL048-600-6205）又は最寄りの労働基準監督署へお尋ねください。
  
