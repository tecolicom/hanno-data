description: |-
  🔄 内容更新 (公開日: 2026-09-04 / 前回掲載: 2026-09-05)
  
  ## 令和8年度熊本地震に係る被災地派遣職員等（熊本市）の報告会
  
  日時：令和8年9月1日（火曜日） 午後1時15分
  
  場所：飯能市役所本庁舎別館1階 危機管理会議室
  
  被災地（熊本市）への人的支援（避難所運営業務及び被害家屋調査認定業務）として派遣していた2名から、市長へ被災地の現状等を報告しました。
  
  被災地への派遣
  
  【派遣人数及び派遣期間】
  
  （熊本市） 2名：令和8年8月17日（月曜日）から令和8年8月25日（火曜日）
  
  【業務内容】
  
  避難所運営業務の支援
  
  家屋の被害認定業務の支援 等
  
  飯能市公式サイト 新着情報: https://www.city.hanno.lg.jp/soshikikarasagasu/somubu/bosaikikikanri/bosai/14352.html

