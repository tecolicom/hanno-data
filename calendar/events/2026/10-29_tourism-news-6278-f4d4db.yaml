  AI による要約 (正確な情報は元記事をご確認ください)
  
  令和8年飯能まつりが11月7日(土)・8日(日)の2日間で開催されます。山車・屋台曳行や居囃子、獅子舞などの伝統的行事と市民パレード、模擬店、イベントが融合したお祭りです。地域住民と観光客が一堂に集まり賑わいをみせます。開催場所は飯能駅北口周辺(大通り・銀座通り・中央通りほか)。雨天決行、荒天中止。両日ともに開催内容の一部を変更する場合があります。

