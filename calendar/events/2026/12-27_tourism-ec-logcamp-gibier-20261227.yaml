      Hanno Ecotourism Association: https://hanno-tourism.jp/hanno-eco/tour/ec-logcamp-gibier/
      
      This is an experiential tour from the butchering of deer caught in Hanno to eating game meat cuisine. As part of wildlife damage control—a key challenge in mountainous areas—you'll tour the butchery facility Muzika and learn about the current state of wildlife damage prevention. Then, with gratitude for the mountain's bounty, you'll enjoy game meat dishes at the restaurant "Log Camp".
      
      【Fee】10,000 yen per person (includes guide, meal, and insurance)
      
      【Capacity】8 people
      
      【Guide】Yoshinori Sato (Specified Nonprofit Organization crew-L)
      
