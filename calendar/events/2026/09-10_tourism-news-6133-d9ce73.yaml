  ムーミンバレーパークで秋のイベント「ムーミンバレーパークのハーベスト」を開催します。期間は2026年9月12日(土)~10月25日(日)。新しいテラスや参加型ショー「アップル・ポップ・プレイタイム!」、秋のアンブレラスカイなど、秋の見どころが満載です。
  
  【特別サービス】
  ・9月21日(月・祝)敬老の日当日:65歳以上無料招待
  ・9月19日(土)~9月23日(水・祝)敬老の日ウィーク:シニア割実施
  ・こども応援キャンペーン:4歳~高校生以下が1デーパス500円(税込)(通常1,300円)
  ・U22パス:18歳~22歳が1デーパス2,200円(税込)(通常4,300円、前売限定)

