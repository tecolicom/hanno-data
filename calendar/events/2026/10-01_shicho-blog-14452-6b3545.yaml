description: |-
  📝 市長ブログ更新 (公開日: 2026-09-28)
  
  9月28日（月曜日）、令和8年熊本地震義援金支援チャリティーイベントを9月19日（土曜日）に開催された「よさこい飯能乱舞」の皆様がイベントのご報告にお越しくださいました。
  
  被災地の復興を願い、すぐさま行動を起こされた皆様に、飯能市を代表し、深く敬意と感謝を申し上げます。皆様のご支援と温かい思いは、必ずや被災地の皆様の活力につながるものと確信しています。
  
