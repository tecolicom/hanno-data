  AI による要約 (正確な情報は元記事をご確認ください)
  
  飯能市原市場福祉センターが臨時休館しております。空調設備が不調のため、令和8年7月29日より休館中です。8月4日（火曜日）から受付予定であった10月分の予約は、しばらくの間見合わせます。メンテナンスの完了時期は現在見通せないため、受付開始の期日については改めてホームページ等でお知らせいたします。不調の原因は落雷によるものと判明し、現在修繕に向けて業者へ発注中です。
  
  飯能市公式サイト 新着情報: https://www.city.hanno.lg.jp/soshikikarasagasu/kenkohukusibu/chiikifukushika/tiikifukushi/14108.html

