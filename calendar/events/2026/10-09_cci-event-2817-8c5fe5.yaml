description: |-
  令和８年１１月８日（日）午前１０時〜午後７時まで
  
  埼玉りそな銀行飯能支店駐車場において「飯能元気まつり」を開催します。
  
  当日は飯能まつりも開催されておりまち全体が大変賑わっています。
  
  商工会議所では、西川材のＰＲと東北地域間交流として飯能から元気を発信します！
  
  東北の海産物や地元グルメもあります。
  
  会場前では山車の引合せ等も実施されますので、観覧の傍ら是非、ご来場ください。
  
  ※駐車場はございませんので公共交通機関をご利用ください。
  
  https://www.hanno-cci.or.jp/xo_event/xo_event-2817/

