  🆕 新着掲載 (公開日: 2026-05-20)
  
  AI による要約 (正確な情報は元記事をご確認ください)
  
  奥むさし飯能観光協会は飯能商工会議所の定期施設メンテナンスのため、令和8年6月6日(土)・6月7日(日)に電話対応を含む案内業務を休業いたします。対象日はイーグルバス定期券ご購入とマンホールカードの配布ができかねます。なお、ぷらっと飯能（飯能駅観光案内所 TEL 042-978-9111 9時～17時）は通常通り営業しております。

