  AI による要約 (正確な情報は元記事をご確認ください)
  
  飯能観光案内所 おみやげショップ夢馬は令和8年4月1日より休館します。お土産品等の商品販売は令和8年3月13日（金）まで、観光案内業務と隣接の観光公衆トイレ利用は令和8年3月31日（火）までとなります。引き続き飯能駅観光案内所ぷらっと飯能でお土産品の販売を行います。なお同施設は令和8年4月1日〜4月10日は改装作業のため休業し、4月より営業時間が平日・土日祝日ともに9時〜17時に変更されます。

