description: |-
  📝 市長ブログ更新 (公開日: 2026-08-05)
  
  8月5日（水曜日）、埼玉りそな銀行飯能支店主催による、小学生向け金融経済教育「りそなグループキッズマネーアカデミー2026」が、市内企業や飯能市役所を会場に開催されました。市役所見学では市長室や議長室、議場を児童が見学しました。
  
