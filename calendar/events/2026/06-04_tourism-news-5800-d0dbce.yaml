  🆕 新着掲載 (公開日: 2026-06-04)
  
  AI による要約 (正確な情報は元記事をご確認ください)
  
  飯能河原は台風6号の影響により増水しています。6月2～3日の台風接近により中洲が水浸しの状態ですが、6月6日(土)・7日(日)は雨が降らなければ通常通り火気使用エリアの営業を行います。雨の場合はスタッフ配備の営業はしません。BBQ等の利用は可能ですが、増水で流れが早く危険なため、水遊びなど川の中には入らないようお願いします。お子様連れの方は十分注意してください。利用予定の方は事前に公式サイト「飯能河原。いい塩梅。」でルール等を確認してください。

