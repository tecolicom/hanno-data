  🆕 新着掲載 (公開日: 2026-03-29)
  
  AI による要約 (正確な情報は元記事をご確認ください)
  
  飯能市内の観光案内所2か所の休業日と営業時間が令和8年4月11日より変更されます。奥むさし飯能観光協会（飯能商工会議所内）は毎週日曜日（祝日の場合営業、振替休日を休業）と年末年始が休業、営業時間は9時-17時。飯能駅観光案内所ぷらっと飯能は年末年始が休業（令和8年4月1日〜4月10日は改装に伴い休業）、営業時間は9時-17時（平日・土日祝共通）。マンホールカードの配布やイーグルバス定期券の販売は奥むさし飯能観光協会でできなくなります。

