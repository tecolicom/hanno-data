  🆕 新着掲載 (公開日: 2026-09-04)
  
  埼玉県では、本州付近に停滞する前線や暖かく湿った空気の影響により、大気の状態が不安定となる見込みです。
  
  低い土地の浸水や河川の増水、土砂災害に注意・警戒してください。
  
