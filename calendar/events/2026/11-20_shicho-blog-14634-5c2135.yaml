description: |-
  📝 市長ブログ更新 (公開日: 2026-11-05)
  
  11月5日（木曜日）、埼玉県内に4つある林業対策協議会を代表し、大野元裕埼玉県知事、吉良英敏埼玉県議会副議長に森林資源の循環利用を図る「活樹」の取組を力強く進めること、持続可能な地域林業と木材産業の確立などを要望しました。
  
  林業振興、山間地域の活性化に向け、力の限り取り組んでいきます。
  
