description: |-
  🆕 新着掲載 (公開日: 2026-08-18)
  
  ## お知らせ
  
  阿須運動公園と岩沢運動公園を繋ぐ流れ橋が大雨の影響で橋桁が流され、通行ができない状態となっております。ご利用の皆様にはご不便ご迷惑をおかけしますが、御理解ご協力の程よろしくお願い致します。
  
  復旧時期について
  
  流れ橋の復旧につきましては、川の水位が下がり橋桁を設置できる状況になりましたら、随時ホームページを更新いたします。
  
  飯能市公式サイト 新着情報: https://www.city.hanno.lg.jp/soshikikarasagasu/tosikensetubu/ijikanrika/14269.html

