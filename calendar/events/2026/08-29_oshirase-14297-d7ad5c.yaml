description: |-
  🆕 新着掲載 (公開日: 2026-08-27)
  
  AI による要約 (正確な情報は元記事をご確認ください)
  
  飯能市と長ぐつを脱いだ猫株式会社は、令和8年8月27日に包括連携協定を締結しました。飯能市の強固な地盤という特徴をプロモーションし、防災減災対策、移住定住促進、健康づくり、生涯現役での起業家支援、公共施設等の天然芝整備によるまちづくりを推進します。
  
  連携事項は以下の通り：
  ・健康づくり
  ・移住定住促進及び起業家支援
  ・地震に強いまちのプロモーション及び防災減災対策
  ・公共施設等の緑化（天然芝の整備）を通じたまちづくり
  ・その他協定目的達成に必要な事項
  
  飯能市公式サイト 新着情報: https://www.city.hanno.lg.jp/soshikikarasagasu/sogoseisakubu/kikakuka/tihousouseikouikigyousei/sangakukanrenkei/14297.html

