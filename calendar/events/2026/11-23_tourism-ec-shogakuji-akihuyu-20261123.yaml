  飯能エコツーリズム協会: https://hanno-tourism.jp/hanno-eco/tour/ec-shogakuji-akihuyu/
  
  曹洞宗認可参禅道場の正覚寺で飯能の自然の中、川の音、風の音、鳥のさえずりを聞きながら坐禅を中心とした修行体験をします。
  
