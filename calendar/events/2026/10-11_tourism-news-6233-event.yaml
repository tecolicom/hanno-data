  AI による要約 (正確な情報は元記事をご確認ください)
  
  飯能の路地を知り、親しみ、路地の価値を再発見するイベント「第4回　一丁目路地あそび」。路地で昔あそびなどを通しての多世代交流を楽しめます。
  
  【開催日時】2026年10月11日（日）10:00〜15:00
  【参加費】無料
  【内容】路上お絵描き、昔あそび（コマ・ベーゴマ・剣玉・折り紙・フラフープ・メンコ）、囲碁・将棋、看板おじさんおもしろ企画、紙芝居・絵本交換会
  【天候】小雨決行。延期の場合は10月12日（月・祝）に実施

