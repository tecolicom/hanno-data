  ・こども図書館での館内閲覧、図書の貸出、返却はできません。
  
  ・予約した資料の受け取りが「こども図書館」の方については「市立図書館」での受け取りをお願いいたします。
  
  ・ブックポストについては休館期間中についても利用可能です。
  
