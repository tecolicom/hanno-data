summary: "💼 会員企業さまへ経営サポーター制度活用のご案内 【埼玉県】"
location: "飯能商工会議所"
url: "https://www.hanno-cci.or.jp/xo_event/xo_event-2716/"
dtstart: "2026-04-20"
dtend: "2026-04-20"
description: |-
  埼玉県では、県内の中小企業・小規模事業者が適正な利益を確保し、賃上げ環境の整備が円滑に図られるよう、県では令和8年3月31日から「経営サポーター」を新設し、伴走型による事業者支援を開始します※。
  
  事業者の皆さま、是非経営サポーターをご活用ください。
  
  ※令和7年度2月補正予算経済対策事業
  
  経営サポーターの取組
  
  県が行う各種支援策をご案内
  支援の要望があった事業者からのご相談をお受けし、支援策をマッチング
  事業者の適正な利益の確保、賃上げ環境の整備に向けた伴走支援を実施
  
  実施期間
  
  令和8年3月31日～令和9年3月
  
  ※支援期間終了後も商工会議所、商工会の経営指導員が継続的に支援します。
  
  飯能商工会議所では埼玉県・埼玉県商工会議所連合会と連携し、会員企業様へ制度活用のご案内のお電話が行く場合がありますので、あらかじめご承知おきください。
  
  詳細リンク
  
  ■経営サポーターを活用しませんか！～事業者の利益の確保に向けて無料で伴走支援します～ - 埼玉県
  
