dtstart: "2026-03-06"
dtend: "2026-03-06"
description: |-
  本補助事業は、小規模事業者等が自ら策定した持続的な経営に向けた経営計画に基づく、販路開拓等の取組や、販路開拓等と併せて行う業務効率化の取組を支援するため、それに要する経費の一部を補助するものです。
  
  本説明会では、補助金の制度解説や利用事例をわかりやすくご紹介します。担当指導員が補助金の申請までお手伝いしますので、この機会に是非ご参加いただき、役立ててください。詳細及びお申し込みは以下チラシよりご覧ください。
  
  担当課
  
  中小企業相談所
  
  https://www.hanno-cci.or.jp/xo_event/xo_event-2422/

