uid: "cci-event-2669-5fa30c@hanno.city.tecoli.com"
summary: "🎓 【7/3建設業部会向け】埼玉県「中小企業DX導入支援補助金」活用セミナー ～中小建設業のためのDX推進～"
location: "飯能商工会議所"
url: "https://www.hanno-cci.or.jp/xo_event/xo_event-2669/"
dtstart: "2026-06-09"
dtend: "2026-06-09"
description: |-
  本説明会では、人手不足などの課題に直面する建設業界を対象に、ITツールの導入による 「現場の省力化」と「生産性の向上」を支援します。
  
  具体的には、最大300万円の補助が受けられる「令和8年度 埼玉県中小企業DX導入支援補助金」を中心に、専門家による「DX推進員派遣制度」について建設業における活用事例を交えながら 分かりやすく解説します。
  「何から取り組めばよいか分からない」、「申請書類の作成に不安がある」と いった方もご安心ください。担当指導員が申請から導入まで伴走支援いたします。
  
  デジタル化を将来への“投資”へとつなげる絶好の機会です。ぜひご参加いただき、貴社の経営改善にお役立てください。
  
  事業概要
  
  日時令和８年７月３日（金）16：00～17：00
  会場飯能商工会議所　大会議室
  内容ＤＸの現状と課題の理解建設業のDXの状況
  ＤＸをどう進めるべきか推進の方向性県内事例のご紹介
  
  デジタルツール・支援制度のご紹介明日から使えるデジタルツール埼玉県中小企業DX導入支援補助金 など
  定員３０名
  受講料無料（建設業部会　会員に限る）
  お申込み■セミナーのお申込みはこちらより（Microsoft Formsが開きます）
  
  https://www.hanno-cci.or.jp/xo_event/xo_event-2669/

