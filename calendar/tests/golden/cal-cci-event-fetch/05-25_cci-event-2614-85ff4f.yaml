description: |-
  ６月、７月の定例専門家相談は、以下の日程で実施します。
  ご相談をご希望の方は予約のリンクから手続きを進めてください。
  
  ６月分
  
  日時相談会名担当専門家予約予約〆切
  予定なし税務・インボイス制度無料個別相談関東信越税理士会所沢支部飯能地区会所属の税理士相談日の5営業日前の午前中
  6/16（火）13:30～経営法律相談佐々木翔先生（弁護士）
  6/12（金）10:00～人事労務相談横地冬美先生（社会保険労務士・行政書士）
  6/10（水）13:30～承継M&A相談事業承継士および各種士業
  6/15（月）10:00～知的財産相談松田克治 先生（弁理士）
  6/15（月）10:00～日本政策金融公庫による相談日本政策金融公庫川越支店担当
  
  ７月分
  
  日時相談会名担当専門家予約予約〆切
  7/ 9（木）9:30～税務・インボイス制度無料個別相談関東信越税理士会所沢支部飯能地区会所属の税理士相談日の5営業日前の午前中
  7/21（火）13:30～経営法律相談佐々木翔先生（弁護士）
  7/10（金）10:00～人事労務相談横地冬美先生（社会保険労務士・行政書士）
  7/ 8（水）13:30～承継M&A相談事業承継士および各種士業
  7/27（火）10:00～知的財産相談松田克治 先生（弁理士）
  7/15（水）13:30～日本政策金融公庫による相談日本政策金融公庫川越支店担当
  
  ※こちらの相談会は、商工会議所会員の方のみご利用いただけます。予めご了承ください。
  
