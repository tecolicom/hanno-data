description: |-
  「カスタマーハラスメント(カスハラ)」とは、顧客から無理な要求をされたり、しつこく責め立てられたりすることなどにより、働く人の環境が害されることをいいます。
  埼玉県では、誰もが安心して働くことができる就業環境や安定した事業活動を継続できる環境、豊かな消費生活を実現するため、関係者の責務を定める条例を制定しました。
  
  埼玉県では、条例施行に向けて、以下の取り組みを行っています。
  
  事業者・事業者団体向け 基本方針・対応マニュアル作成のための手引きの公開
  カスタマーハラスメント防止対策コンサルタント派遣事業（5月7日募集開始）
  カスハラ対策WEBセミナー（募集中）
  
  詳しくは以下よりご確認ください。
  
  ■埼玉県カスタマーハラスメント防止対策
  
  https://www.hanno-cci.or.jp/xo_event/xo_event-2576/

