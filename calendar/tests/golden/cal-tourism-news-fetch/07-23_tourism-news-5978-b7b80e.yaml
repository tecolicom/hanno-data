  令和8年の飯能まつりは11月7日(土)、8日(日)に開催予定です。安心・安全でにぎやかな祭りの開催に向けて、協賛金を募集しています。今年から個人の方からも協賛いただけるよう新たな協賛金額を設定しました。申込方法は案内書類またはGoogleFormで受け付けています。

