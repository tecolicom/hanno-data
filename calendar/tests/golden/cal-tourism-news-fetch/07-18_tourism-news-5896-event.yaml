  AI による要約 (正確な情報は元記事をご確認ください)
  
  令和8年飯能夏祭りが7月18日(土)・19日(日)に開催されます。18日の宵宮では11時45分より飯能八坂神社で祈願祭が執り行われ、底抜け屋台は朝9時ごろから町内廻りが始まり終日引き回されます(21時まで)。19日の本祭りでは15時に飯能八坂神社前に5ヵ町の屋台が集合整列し、祝囃子の奉納と参拝が行われた後、夜まで市街地各所で引き合わせが行われ、19時40分には大通りで10ヵ町による引き合わせが行われます。2日間ともグルメや物産の出店があります。会場は飯能駅北口から徒歩すぐで、公共交通機関のご利用をお願いします。専用駐車場はございません。2日間とも該当時間・箇所に交通規制がかかります。

