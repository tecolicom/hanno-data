  令和8年11月7日(土)、8日(日)に開催予定の飯能まつりについて、協賛金を募集しています。個人の方からも協賛いただけるよう新たな協賛金額を設定しました。申込方法は、案内書類に記載の振込先への振込、または申込書(PDF版またはGoogleForm版)での申し込みです。詳細は案内書類をご確認ください。

