# クローラの source 別設定 (city 固有値)。
# 多都市展開時は各 data repo がこのファイルを持つ。クローラのコード (calendar/bin/) は
# 都市非依存で、ここの値を起動時に読み込む。
# 注: repo 単位の値 (uid_namespace / user_agent / カレンダー ID / routing) は city.yaml。
oshirase:
  uid_prefix: oshirase
  source_type: city-hanno-oshirase
  summary_prefix: "ℹ️ "
  feed_url: "https://www.city.hanno.lg.jp/cgi-bin/feed.php?siteNew=1&displayCount=50&displayRange=90&includeShortcut=0"
  url_host_allowlist: www.city.hanno.lg.jp

shicho-blog:
  uid_prefix: shicho-blog
  source_type: city-hanno-shicho-blog
  summary_prefix: "📝 市長："
  top_url: "https://www.city.hanno.lg.jp/shiseijoho/shichoshitsu/shichoblog/index.html"
  url_host_allowlist: www.city.hanno.lg.jp
  url_path_prefix: "/shiseijoho/shichoshitsu/shichoblog/"

# hanno-tourism.jp の news 投稿タイプ。tour (cal-tourism-fetch) とは別クローラ。
# 1 記事から告知 (掲載日) と本番 (開催日) の最大 2 イベントを作る。
tourism-news:
  uid_prefix: tourism-news
  source_type: hanno-tourism-jp-news
  # 告知と本番で prefix を変える。本番側はイベント系タグの有無で決定論的に
  # 選ぶ (LLM の判断を挟まない)。
  summary_prefix_notice: "📢 "
  summary_prefix_event: "🎪 "
  summary_prefix_other: "ℹ️ "
  api_url: "https://hanno-tourism.jp/wp-json/wp/v2/news"
  url_host_allowlist: hanno-tourism.jp
  url_path_prefix: "/news/"
  backfill_months: 6

# 飯能商工会議所「日替わりシェフレストラン」当番表。
# **集合同期型** — 1 ページに全期間の予定が JSON で埋め込まれており、取得側に
# 無い予定は削除する (既存の追記型クローラとは別系統)。
cci-chef:
  uid_prefix: chef
  source_type: hanno-cci-chef
  page_url: "https://www.hanno-cci.or.jp/manage/founded/"
  anchor: "02"
  location: "日替わりシェフレストラン"
  url_host_allowlist: www.hanno-cci.or.jp
  max_delete: 10

# 飯能商工会議所の告知 (xo_event 投稿タイプ)。追記型。
# 開催日は取れない (postmeta にあり REST も RSS も出さない) ので dtstart は掲載日。
#
# **REST API は使わない。** wp-json は Xserver の国外 IP 制限で GitHub Actions
# から 403 になる (2026-08-20 実測)。カテゴリ別 RSS を使う。content:encoded に
# 本文全文が入るので REST の利点はほぼ保たれる。取り込むカテゴリは
# bin/cal-cci-event-fetch の SLUG_TO_CAT_ID が持つ (検定 exam は除外)。
cci-event:
  uid_prefix: cci-event
  source_type: hanno-cci-event
  feed_base: "https://www.hanno-cci.or.jp/xo_event_cat"
  site_url: "https://www.hanno-cci.or.jp/"
  location: "飯能商工会議所"
  url_host_allowlist: www.hanno-cci.or.jp
  url_path_prefix: "/xo_event/"
  after: "2026-01-01T00:00:00"
  # 1 カテゴリあたりの最大ページ数 (1 ページ 10 件)。暴走防止。
  max_pages: 10

# 飯能市立図書館の休館日。**集合同期型** — cal.php が月ごとに「その月の全休館日」
# を返すので、取得側に無い日は削除する。LLM 不使用。
#
# **取得できる範囲は年度末までで、固定の月数ではない。** 休館日は年度単位で
# 登録されており、取れる月数は観測時期で 1〜12 か月に変わる。months_ahead は
# 「配信元が持ちうる最大」で、返った分だけを扱う。
#
# min_days_per_month は **館ごと・返ってきた月ごと**の下限。総数の固定値だと
# (a) 年度末に近づくと正常時でも赤になり、(b) 片方の館が丸ごと空でも
# もう片方の分で閾値を超えて半分の欠落が静かに通る。
lib-closed:
  cal_url: "https://www.hanno-lib.jp/cal.php"
  page_url: "https://www.hanno-lib.jp/calendar/"
  url_host_allowlist: www.hanno-lib.jp
  summary_prefix: "🏛 "
  months_ahead: 12
  min_days_per_month: 3
  max_delete: 10
  libraries:
    - code: "01"
      name: "飯能市立図書館"
      uid_prefix: libmain-closed
      source_type: hanno-lib-main-closed
    - code: "02"
      name: "こども図書館"
      uid_prefix: libkids-closed
      source_type: hanno-lib-kids-closed

# 飯能市立図書館のイベント。追記型。
# cal.php の event_day → events.php (その日の記事一覧) → 詳細ページ、の 3 段。
# events.php は term_to を無視するので 1 日 1 リクエスト。max_event_days は
# その暴走防止 (cci-event の max_pages と同じ発想)。
#
# **件数では異常を測れない。** event_day が 0 件の期間は普通にある
# (本館 01 は 2026-08 時点で全月 0 件)。疎通の判定は cal.php の応答が JSON として
# 読めるかで行う (_hanno_lib.terms_of が ValueError を投げる)。
lib-event:
  cal_url: "https://www.hanno-lib.jp/cal.php"
  events_url: "https://www.hanno-lib.jp/events.php"
  site_url: "https://www.hanno-lib.jp/"
  url_host_allowlist: www.hanno-lib.jp
  url_path_prefix: "/calendar/"
  summary_prefix: "📚 "
  months_ahead: 12
  max_event_days: 60
  libraries:
    - code: "01"
      name: "飯能市立図書館"
      uid_prefix: libmain-event
      source_type: hanno-lib-main-event
    - code: "02"
      name: "こども図書館"
      uid_prefix: libkids-event
      source_type: hanno-lib-kids-event
